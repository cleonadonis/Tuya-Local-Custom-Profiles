# cas_wifi_knob_thermostat_axhyyv6w36e5oagp_v1_7.yaml v1_7
# 2025-09-19 20:21:38 WEST
name: WiFi Knob Thermostat
products:
  - id: axhyyv6w36e5oagp

entities:
  - entity: climate
    name: Thermostat
    icon: mdi:thermostat
    precision: 1.0
    dps:
      # Power mapped as HVAC mode -> enables climate.turn_on/off
      - id: 1
        name: hvac_mode
        type: boolean
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            value: "heat"

      # Auto/Manual program as preset
      - id: 2
        name: preset_mode
        type: string
        mapping:
          - dps_val: auto
            value: auto
          - dps_val: manual
            value: manual

      - id: 3
        name: temperature
        type: integer
        unit: "°C"
        range:
          min: 5
          max: 45
          step: 1

      - id: 24
        name: current_temperature
        type: integer
        unit: "°C"
        range:
          min: 0
          max: 50
          step: 1

  - entity: sensor
    name: Humidity
    class: humidity
    dps:
      - id: 25
        name: sensor
        type: integer
        unit: "%"
        range:
          min: 0
          max: 100
          step: 1

  - entity: number
    name: Backlight
    icon: mdi:brightness-6
    dps:
      - id: 44
        name: value
        type: integer
        unit: "%"
        range:
          min: 0
          max: 100
          step: 1

  - entity: select
    name: Work days
    icon: mdi:calendar-week
    dps:
      - id: 31
        name: option
        type: string
        mapping:
          - dps_val: "5_2"
            value: "Mon–Fri (5+2)"
          - dps_val: "6_1"
            value: "Mon–Sat (6+1)"
          - dps_val: "7"
            value: "Everyday (7)"

  - entity: select
    name: Temperature sensor
    icon: mdi:vector-point
    dps:
      - id: 101
        name: option
        type: string
        mapping:
          - dps_val: in
            value: Room
          - dps_val: out
            value: Floor
          - dps_val: all
            value: Both

  - entity: number
    name: High temp limit
    icon: mdi:thermometer-chevron-up
    dps:
      - id: 102
        name: value
        type: integer
        unit: "°C"
        range:
          min: 10
          max: 45
          step: 1

  - entity: number
    name: Low temp limit
    icon: mdi:thermometer-chevron-down
    dps:
      - id: 103
        name: value
        type: integer
        unit: "°C"
        range:
          min: 0
          max: 10
          step: 1

  - entity: number
    name: Differential
    icon: mdi:delta
    dps:
      - id: 106
        name: value
        type: integer
        unit: "°C"
        range:
          min: 1
          max: 5
          step: 1

  - entity: number
    name: Calibration
    icon: mdi:thermometer-plus
    dps:
      - id: 108
        name: value
        type: integer
        unit: "°C"
        range:
          min: -9
          max: 9
          step: 1

  - entity: sensor
    name: Work state
    icon: mdi:information-outline
    dps:
      - id: 32
        name: sensor
        type: string

  - entity: sensor
    name: Fault
    icon: mdi:alert-circle-outline
    dps:
      - id: 45
        name: sensor
        type: bitfield
